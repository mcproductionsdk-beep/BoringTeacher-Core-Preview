<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Invaders — Boring Teacher Core Preview</title>
<link rel="stylesheet" href="./styles/menu.css">
<style>body{margin:0;background:#10192e;color:#f8f8ff;font-family:"Courier New",monospace}#invadersFrame{display:none;width:100%;height:calc(100dvh - 12px);min-height:600px;border:0;background:#16264e}#invadersFrame.playing{display:block}#app{max-width:1100px;margin:8px auto}</style></head>
<body><main id="app"></main><iframe id="invadersFrame" title="Word Invaders gameplay" src="./invaders-game.html?release=invaders-core-preview-1"></iframe>
<script type="module">
import {mountTeacherMenu,mountStudentMenu} from './core/menu.js?release=core-20261020';
import {createSharingClient,readStudentSetId} from './core/sharing.js';
import {createVoiceService} from './core/voice.js';
import {WAREHOUSE_CATEGORIES} from './core/warehouse-categories.js';
const root=document.getElementById('app'),frame=document.getElementById('invadersFrame');
const sharing=createSharingClient({apiBaseUrl:'https://boringteacher-vocabulary-api.mcproductionsdk.workers.dev'});
const voice=createVoiceService();let menu=null,ready=false,pending=null;
const options={title:'WORD INVADERS',instructions:'LEFT / RIGHT or A / D = move · SPACE / UP / W = fire · P = pause. Shoot the correct translation among four descending invaders. Mobile touch controls are available.',categories:WAREHOUSE_CATEGORIES,defaultCategory:'Animals',defaultText:'',previewGameUrl:location.href,onPlay:start};
function deliver(){if(!ready||!pending)return;frame.contentWindow.postMessage({type:'BT_INVADERS_START',pairs:pending.pairs,language:pending.language},location.origin);pending=null;}
function start(vocabulary){pending=vocabulary;menu?.destroy();menu=null;root.hidden=true;frame.classList.add('playing');deliver();frame.contentWindow?.postMessage({type:'BT_INVADERS_PING'},location.origin);frame.focus();}
function showMenu(forceTeacher=false){frame.classList.remove('playing');root.hidden=false;menu?.destroy();menu=null;voice.cancel();menu=!forceTeacher&&readStudentSetId(location.href)?mountStudentMenu(root,{sharing,voice},{...options,studentUrl:location.href,onRecover:()=>{history.replaceState(null,'',location.pathname+location.search);showMenu(true);}}):mountTeacherMenu(root,{sharing,voice},options);}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;const d=e.data||{};
if(d.type==='BT_INVADERS_READY'){ready=true;deliver();}
if(d.type==='BT_INVADERS_SPEAK'&&typeof d.text==='string'&&d.text.length<=250&&['es-ES','de-DE','da-DK','en-US'].includes(d.language)){void voice.speak(d.text,d.language);}
if(d.type==='BT_INVADERS_MENU'){history.replaceState(null,'',location.pathname+location.search);showMenu(true);}
if(d.type==='BT_INVADERS_ERROR'){frame.classList.remove('playing');root.hidden=false;root.textContent='Word Invaders could not start: '+String(d.message||'Invalid vocabulary');}
});
frame.addEventListener('load',()=>{ready=false;frame.contentWindow?.postMessage({type:'BT_INVADERS_PING'},location.origin);});
showMenu();frame.contentWindow?.postMessage({type:'BT_INVADERS_PING'},location.origin);
</script></body></html>
