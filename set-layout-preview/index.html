<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Set — Boring Teacher (Layout Preview)</title>
<style>:root{font-family:"Courier New",monospace;color:#102744;background:#63b7df}*{box-sizing:border-box}body{margin:0;padding:20px}.shell{max-width:960px;margin:auto}header{background:#102744;color:#fff;text-align:center;padding:25px;border:6px solid #102744;box-shadow:7px 7px #ffe04d}header h1{font-size:clamp(25px,5vw,44px);margin:0}header p{color:#ffe04d;margin:5px}main{margin-top:30px;padding:30px;background:#fff3c4;border:7px solid #102744;box-shadow:7px 7px #ffe04d}h2{font-size:clamp(23px,3vw,34px)}form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{font:inherit;font-size:20px;min-width:0;width:220px;padding:12px;border:4px solid #102744;text-transform:uppercase}button,.game{font:inherit;cursor:pointer;border:5px solid #102744;padding:14px;background:#ffe04d;color:#102744;text-decoration:none;font-weight:bold}.game{display:block;background:#79d64f}.game:hover,.game:focus{background:#a9ed82}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}.game small{display:block;margin-top:10px}#status{min-height:1.5em}#details[hidden]{display:none}.muted{font-size:13px}a{color:inherit}@media(max-width:540px){body{padding:10px}main{padding:18px}input{width:100%}}.vocabPanel{margin-top:30px;padding-top:18px;border-top:5px dashed #102744}.vocabPanel h2{margin:0 0 14px}.meta{display:flex;gap:25px;flex-wrap:wrap}.games{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:12px}.game{display:flex;align-items:center;gap:13px;min-height:94px}.gameIcon{font-size:34px;display:grid;place-items:center;width:56px;height:56px;flex:none;background:#5cc5d8;border:3px solid #102744;box-shadow:inset -4px -4px #2e7c9a}.game:nth-child(4n+2) .gameIcon{background:#ffe04d;box-shadow:inset -4px -4px #c19b25}.game:nth-child(4n+3) .gameIcon{background:#79d85b;box-shadow:inset -4px -4px #419438}.game:nth-child(4n+4) .gameIcon{background:#ef6c88;box-shadow:inset -4px -4px #b52f49}.gameLabel{min-width:0}.game small{font-size:12px;line-height:1.3}.vocabPanel input{width:190px}@media(max-width:540px){.game{min-height:82px}.vocabPanel input{width:100%}}/* Compact arcade layout v2 */
.shell{max-width:880px}body{padding:12px}header{padding:13px;border-width:5px}header h1{font-size:clamp(22px,3.5vw,32px)}header p{font-size:12px}main{margin-top:17px;padding:18px;border-width:5px}h2{font-size:clamp(19px,2.4vw,25px);margin:8px 0}.games{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:10px}.game{min-height:68px;padding:8px;border-width:4px;gap:9px;font-size:14px}.gameIcon{width:42px;height:42px;font-size:25px}.game small{font-size:10px;line-height:1.25;margin-top:4px}.vocabPanel{margin-top:18px;padding-top:12px;border-top-width:4px}.vocabPanel h2{font-size:21px;margin:0 0 10px}.vocabPanel input{width:150px;padding:7px;font-size:15px}.vocabPanel button{padding:8px;font-size:14px}.meta{gap:22px}.meta p{margin:8px 0;font-size:14px}#status{font-size:14px;margin:8px 0}.muted{font-size:11px}@media(max-width:540px){main{padding:12px}.games{grid-template-columns:1fr}.vocabPanel input{width:100%}}
</style></head>
<body><div class="shell"><header><h1>★ BORING TEACHER ★</h1><p>VOCABULARY SET · CHOOSE YOUR GAME</p></header><main><h2 id="gamesHeading">Choose a game</h2><p id="status" role="status" aria-live="polite">Enter your vocabulary set ID below to unlock the games.</p><section id="details" hidden><div class="games" id="games"></div></section><section class="vocabPanel"><h2 id="heading">My vocabulary</h2><form id="form"><label for="id">Set ID</label><input id="id" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" aria-label="Vocabulary set ID"><button type="submit">LOAD</button></form><div class="meta"><p><b>Language:</b> <span id="lang">—</span></p><p><b>Words:</b> <span id="count">—</span></p></div></section><p class="muted">Development preview · Vocabulary titles are shown from saved sets.</p></main></div>
<script>
"use strict";
const api="https://boringteacher-vocabulary-api.mcproductionsdk.workers.dev";
const games=[["Word Snake","word-snake","🐍"],["Word Racer","word-racer","🏎️"],["Frog River","frog-river","🐸"],["Word Eater","word-eater","🟡"],["Word Jumper","word-jumper","🏃"],["Word Invaders","word-invaders","👾"],["Matching Columns","matching-columns","🔗"]];
const $=id=>document.getElementById(id),valid=id=>/^[A-Z0-9]{6}$/.test(id);
async function load(id){$("details").hidden=true;$("heading").textContent="Open a vocabulary set";$("status").textContent="Loading vocabulary…";$("id").value=id;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(api+"/sets/"+encodeURIComponent(id),{signal:controller.signal});if(!response.ok)throw new Error(response.status===404?"Vocabulary set not found. Check the ID.":"The vocabulary service returned an error ("+response.status+").");const data=await response.json(),set=data?.set??data;const pairs=Array.isArray(set?.pairs)?set.pairs:Array.isArray(set?.vocabulary)?set.vocabulary:null;if(!set||typeof set.title!=="string"||typeof set.language!=="string"||!pairs||!pairs.length)throw new Error("The saved vocabulary has an unexpected format.");$("heading").textContent=set.title;$("lang").textContent=set.language;$("count").textContent=String(pairs.length);$("games").replaceChildren();for(const [name,path,icon] of games){const a=document.createElement("a");a.className="game";a.href="https://boringteacher.com/"+path+"/#set="+encodeURIComponent(id);const badge=document.createElement("span");badge.className="gameIcon";badge.textContent=icon;badge.setAttribute("aria-hidden","true");const label=document.createElement("span");label.className="gameLabel";label.textContent=name;const small=document.createElement("small");small.textContent="Play with this vocabulary";label.append(small);a.append(badge,label);$("games").append(a)}$("details").hidden=false;$("status").textContent="Vocabulary loaded. Choose a game.";}catch(err){$("status").textContent=err.name==="AbortError"?"Loading timed out. Try again.":err.message||"Unable to load vocabulary."}finally{clearTimeout(timer)}}
$("form").addEventListener("submit",e=>{e.preventDefault();const id=$("id").value.trim().toUpperCase();if(!valid(id)){$("status").textContent="Enter a valid six-character ID.";return}const url=new URL(location.href);url.searchParams.set("set",id);history.replaceState(null,"",url);load(id)});
const query=new URL(location.href).searchParams.get("set")||location.pathname.match(/^\/set\/([A-Za-z0-9]{6})\/?$/)?.[1];if(query){const id=query.trim().toUpperCase();if(valid(id))load(id);else $("status").textContent="Invalid vocabulary set ID."}
</script></body></html>
