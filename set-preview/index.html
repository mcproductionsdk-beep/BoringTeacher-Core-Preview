<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Set Preview — Boring Teacher</title>
<style>:root{font-family:"Courier New",monospace;color:#102744;background:#63b7df}*{box-sizing:border-box}body{margin:0;padding:20px}.shell{max-width:960px;margin:auto}header{background:#102744;color:#fff;text-align:center;padding:25px;border:6px solid #102744;box-shadow:7px 7px #ffe04d}header h1{font-size:clamp(25px,5vw,44px);margin:0}header p{color:#ffe04d;margin:5px}main{margin-top:30px;padding:30px;background:#fff3c4;border:7px solid #102744;box-shadow:7px 7px #ffe04d}h2{font-size:clamp(23px,3vw,34px)}form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{font:inherit;font-size:20px;min-width:0;width:220px;padding:12px;border:4px solid #102744;text-transform:uppercase}button,.game{font:inherit;cursor:pointer;border:5px solid #102744;padding:14px;background:#ffe04d;color:#102744;text-decoration:none;font-weight:bold}.game{display:block;background:#79d64f}.game:hover,.game:focus{background:#a9ed82}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}.game small{display:block;margin-top:10px}#status{min-height:1.5em}#details[hidden]{display:none}.muted{font-size:13px}a{color:inherit}@media(max-width:540px){body{padding:10px}main{padding:18px}input{width:100%}}</style></head>
<body><div class="shell"><header><h1>★ BORING TEACHER ★</h1><p>VOCABULARY SET · CHOOSE YOUR GAME</p></header><main><h2 id="heading">Open a vocabulary set</h2><p id="status" role="status" aria-live="polite">Enter your six-character set ID to preview.</p><form id="form"><label for="id">Set ID</label><input id="id" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" aria-label="Vocabulary set ID"><button type="submit">LOAD</button></form><section id="details" hidden><p><b>Language:</b> <span id="lang"></span></p><p><b>Words:</b> <span id="count"></span></p><h2>Choose a game</h2><div class="games" id="games"></div></section><p class="muted">Isolated development preview · Existing game links remain unchanged.</p></main></div>
<script>
"use strict";
const api="https://boringteacher-vocabulary-api.mcproductionsdk.workers.dev";
const games=[["Word Snake","word-snake"],["Word Racer","word-racer"],["Frog River","frog-river"],["Word Eater","word-eater"]];
const $=id=>document.getElementById(id),valid=id=>/^[A-Z0-9]{6}$/.test(id);
async function load(id){$("details").hidden=true;$("heading").textContent="Open a vocabulary set";$("status").textContent="Loading vocabulary…";$("id").value=id;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(api+"/sets/"+encodeURIComponent(id),{signal:controller.signal});if(!response.ok)throw new Error(response.status===404?"Vocabulary set not found. Check the ID.":"The vocabulary service returned an error ("+response.status+").");const data=await response.json(),set=data?.set??data;const pairs=Array.isArray(set?.pairs)?set.pairs:Array.isArray(set?.vocabulary)?set.vocabulary:null;if(!set||typeof set.title!=="string"||typeof set.language!=="string"||!pairs||!pairs.length)throw new Error("The saved vocabulary has an unexpected format.");$("heading").textContent=set.title;$("lang").textContent=set.language;$("count").textContent=String(pairs.length);$("games").replaceChildren();for(const [name,path] of games){const a=document.createElement("a");a.className="game";a.href="https://boringteacher.com/"+path+"/#set="+encodeURIComponent(id);a.textContent="▶ "+name;const small=document.createElement("small");small.textContent="Play with this vocabulary";a.append(small);$("games").append(a)}$("details").hidden=false;$("status").textContent="Vocabulary loaded. Choose a game.";}catch(err){$("status").textContent=err.name==="AbortError"?"Loading timed out. Try again.":err.message||"Unable to load vocabulary."}finally{clearTimeout(timer)}}
$("form").addEventListener("submit",e=>{e.preventDefault();const id=$("id").value.trim().toUpperCase();if(!valid(id)){$("status").textContent="Enter a valid six-character ID.";return}const url=new URL(location.href);url.searchParams.set("set",id);history.replaceState(null,"",url);load(id)});
const query=new URL(location.href).searchParams.get("set");if(query){const id=query.trim().toUpperCase();if(valid(id))load(id);else $("status").textContent="Invalid vocabulary set ID."}
</script></body></html>
